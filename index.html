<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>SplitCode — Turn AI Code Into Real Projects</title>

    <meta
      name="description"
      content="SplitCode turns messy AI-generated code into structured, reviewable and export-ready projects directly in your browser."
    />

    <meta
      name="application-name"
      content="SplitCode"
    />

    <meta
      name="theme-color"
      content="#5D2DF5"
    />

    <meta
      name="color-scheme"
      content="light"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://pavan416.github.io/splitcode/"
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%favicon-32.png"
    />

    <link
      rel="manifest"
      href="%BASE_URL%site.webmanifest"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="SplitCode"
    />

    <meta
      property="og:url"
      content="https://pavan416.github.io/splitcode/"
    />

    <meta
      property="og:title"
      content="SplitCode — Turn AI Code Into Real Projects"
    />

    <meta
      property="og:description"
      content="Organize AI-generated code into structured files, inspect relationships, repair common issues and export a real project."

      property="og:image"
      content="https://pavan416.github.io/splitcode/splitcode-social-preview.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="SplitCode — AI code to real project"
    />

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="SplitCode — Turn AI Code Into Real Projects"
    />

    <meta
      name="twitter:description"
      content="Turn messy AI-generated code into structured, reviewable and export-ready projects."
    />

    <meta
      name="twitter:image"
      content="https://pavan416.github.io/splitcode/splitcode-social-preview.png"
